<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acefast Каталог</title>
    <script src="/acefast-shop/telegram-web-app.js"></script>
    <style>
        body { background-color: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 16px; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        @media (prefers-color-scheme: dark) { body { background-color: #1c1c1e; color: #ffffff; } }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .title { font-size: 22px; font-weight: bold; margin: 0; }
        .categories-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 16px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .categories-container::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background-color: #f4f4f5; color: #000000; font-size: 13px; font-weight: 600; cursor: pointer; }
        @media (prefers-color-scheme: dark) { .cat-btn { background-color: #2c2c2e; color: #ffffff; border-color: rgba(255,255,255,0.1); } }
        .cat-btn.active { background-color: #2481cc; color: white; border-color: #2481cc; }
        .catalog-grid { display: grid; grid-template-cols: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 30px; }
        .card { background-color: #f4f4f5; padding: 12px; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(0,0,0,0.05); min-height: 220px; }
        @media (prefers-color-scheme: dark) { .card { background-color: #2c2c2e; } }
        .card-icon { width: 100%; height: 70px; background-color: rgba(36, 129, 204, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 8px; }
        @media (prefers-color-scheme: dark) { .card-icon { background-color: rgba(255,255,255,0.05); } }
        .card-title { font-size: 13px; font-weight: 600; margin: 0 0 6px 0; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .price { color: #2481cc; font-weight: 700; font-size: 14px; margin-bottom: 6px; display: block; }
        
        /* Стили для счетчика и полей ввода количества */
        .quantity-counter { display: flex; align-items: center; justify-content: space-between; background-color: rgba(0,0,0,0.05); border-radius: 10px; padding: 2px; box-sizing: border-box; width: 100%; margin-top: auto; }
        @media (prefers-color-scheme: dark) { .quantity-counter { background-color: rgba(255,255,255,0.1); } }
        .count-btn { background-color: #2481cc; color: white; border: none; width: 28px; height: 28px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .count-input { border: none; background: transparent; width: 42px; text-align: center; font-size: 14px; font-weight: 600; color: inherit; outline: none; }
        
        .cart-section { border-top: 2px solid #2481cc; padding-top: 20px; margin-top: 20px; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.1); font-size: 13px; }
        .checkout-btn { width: 100%; background-color: #34c759; color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 16px; text-align: center; cursor: pointer; display: block; margin-top: 15px; box-sizing: border-box; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header"><h1 class="title">Каталог Acefast ⚡</h1></div>
    <div class="categories-container" id="cats-menu"></div>
    <div class="catalog-grid" id="catalog"></div>
    <div id="cart-container"></div>
    <script>
        var tg = window.Telegram.WebApp;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
            } catch(e) {
                console.error("Ошибка готовности WebApp:", e);
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || '0';

        let cart = {};
        const categories = {
            Waka: "Waka",
            Vapes: "Вейпы",
            Vaporesso: "Vaporesso",
            Elfbar: "Elfbar",
            HQD: "HQD",
            LostMary: "Lost Mary"
        };
        let currentCat = 'cables';

        const products = [
            {"id":1,"name":"Товар 1: Waka 15000","price":450,"category":"Waka"},
            {"id":2,"name":"Товар 2: Rx 300","price":550,"category":"Vapes"},
            {"id":3,"name":"Товар 3: Vaporesso mini 3","price":1200,"category":"Vaporesso"},
            {"id":4,"name":"Товар 4: Elfbar 10000","price":750,"category":"Elfbar"},
            {"id":5,"name":"Товар 5: HQD 10000","price":950,"category":"HQD"},
            {"id":6,"name":"Товар 6: LostMary 7500","price":350,"category":"LostMary"},
            {"id":7,"name":"Товар 7: Waka 10000","price":850,"category":"Waka"},
            {"id":8,"name":"Товар 8: Aegis boost 2","price":890,"category":"Vapes"},
            {"id":9,"name":"Товар 9: Vaporesso 2","price":800,"category":"Vaporesso"},
            {"id":10,"name":"Товар 10: Elfbar 7500","price":1350,"category":"Elfbar"},
            {"id":11,"name":"Товар 11: HQD 15000","price":500,"category":"HQD"},
            {"id":12,"name":"Товар 12: LostMary 20000","price":450,"category":"LostMary"}
        ];
        function loadData() {
            renderMenu();
            renderCatalog();
        }

        function renderMenu() {
            const menu = document.getElementById('cats-menu');
            menu.innerHTML = '';
            Object.keys(categories).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${currentCat === key ? 'active' : ''}`;
                btn.innerText = categories[key];
                btn.onclick = () => { currentCat = key; renderMenu(); renderCatalog(); };
                menu.appendChild(btn);
            });
        }

        // ОБНОВЛЕНО: Генерация карточек товаров с инпутом и кнопками +/- для изменения количества
        function renderCatalog() {
            const grid = document.getElementById('catalog');
            grid.innerHTML = '';
            const filtered = products.filter(p => p.category === currentCat);

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #8e8e93; padding: 20px 0;">В этой категории товаров пока нет</p>';
                return;
            }

            const icons = { cables: "🔌", chargers: "⚡", powerbanks: "🔋", holders: "📱", audio: "🎧", others: "📦" };
            const currentIcon = icons[currentCat] || "📦";

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                const currentQty = cart[p.id] || 0;

                card.innerHTML = `
                    <div class="card-icon">${currentIcon}</div>
                    <h3 class="card-title">${p.name}</h3>
                    <div style="display:flex; flex-direction:column; justify-content:space-between; margin-top:auto; gap: 8px;">
                        <span class="price">${p.price} ₽</span>
                        <div class="quantity-counter">
                            <button class="count-btn" onclick="updateQty(${p.id}, -1)">-</button>
                            <input type="number" class="count-input" id="input-${p.id}" value="${currentQty}" min="0" onchange="setQtyFromInput(${p.id}, this.value)">
                            <button class="count-btn" onclick="updateQty(${p.id}, 1)">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Изменение количества кнопками + / -
        function updateQty(id, delta) {
            let val = (cart[id] || 0) + delta;
            if (val < 0) val = 0;
            setQtyInCart(id, val);
        }

        // Изменение количества при ручном вводе цифр
        function setQtyFromInput(id, value) {
            let val = parseInt(value) || 0;
            if (val < 0) val = 0;
            setQtyInCart(id, val);
        }

        function setQtyInCart(id, val) {
            if (val === 0) {
                delete cart[id];
            } else {
                cart[id] = val;
            }
            const input = document.getElementById(`input-${id}`);
            if (input) input.value = val;
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-container');
            let total = 0;
            let hasItems = false;
            let html = `<div class="cart-section"><h2 class="title" style="font-size:18px; margin-bottom:15px;">Ваша корзина</h2>`;

            Object.keys(cart).forEach(id => {
                const p = products.find(prod => prod.id == id);
                if (p && cart[id] > 0) {
                    hasItems = true;
                    const cost = p.price * cart[id];
                    total += cost;
                    html += `<div class="cart-item">
                        <div><strong>${p.name}</strong><br><span style="color:#8e8e93;">${p.price} ₽ x ${cart[id]}</span></div>
                        <span style="font-weight:700; margin-left:auto;">${cost} ₽</span>
                    </div>`;
                }
            });
            html += `<div style="display:flex; justify-content:space-between; font-weight:bold; margin-top:15px; font-size:16px;"><span>Итого:</span><span style="margin-left:auto;">${total} ₽</span></div>`;
            html += `<button class="checkout-btn" onclick="sendOrder()">Оформить заказ</button></div>`;

            container.innerHTML = hasItems ? html : '';
        }

        // СОХРАНЕНО: Исходный, рабочий метод редиректа через старый тип ссылки!
        // Но сжатый в компактныйPayload, чтобы обойти жесткий лимит 64 символов Telegram.
        function sendOrder() {
            let total = 0;
            let compressedParts = [];
            
            Object.keys(cart).forEach(id => {
                if (cart[id] > 0) {
                    const p = products.find(prod => prod.id == id);
                    if (p) total += p.price * cart[id];
                    // Сжимаем данные: i[ID]q[Количество] -> например i1q2 (товар №1 в количестве 2шт)
                    compressedParts.push("i" + id + "q" + cart[id]);
                }
            });

            if (compressedParts.length === 0) return;

            const botUsername = "Toys_Seller_bot";
            
            // orderPayload будет выглядеть как: i1q5_i12q2
            const orderPayload = compressedParts.join("_");

            // Исходная структура аргументов, которая у вас работала: order_[ДАННЫЕ]_[USER_ID]
            const startParam = "order_" + orderPayload + "_" + userId;
            const targetUrl = "https://t.me/" + botUsername + "?start=" + startParam;

            const container = document.getElementById('cart-container');
            container.innerHTML = `
                <div class="cart-section" style="text-align: center; background-color: rgba(52, 199, 89, 0.1); border-color: #34c759; border-radius: 16px; padding: 20px;">
                    <h2 class="title" style="color: #34c759; font-size: 20px; margin-bottom: 10px;">🎉 Заказ сформирован!</h2>
                    <p style="font-size: 14px; margin-bottom: 20px; color: #8e8e93;">
                        Сумма к оплате: <strong>${total} ₽</strong>.<br>
                        Для подтверждения и отправки заказа менеджеру нажмите на кнопку ниже:
                    </p>
                    <a href="${targetUrl}" target="_blank" class="checkout-btn" style="background-color: #2481cc; margin-top: 0;">
                        ПОДТВЕРДИТЬ В ЧАТЕ БОТА
                    </a>
                </div>
            `;

            cart = {};
            renderCatalog();
        }

        loadData();
    </script>
</body>
</html>
